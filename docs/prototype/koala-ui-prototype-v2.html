let revision=0;
let dialogAction=null;
let dialogTrigger=null;
let idCounter=10;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;

const activeProfile=()=>state.profiles.find(p=>p.id===state.active);
const viewedProfile=()=>state.profiles.find(p=>p.id===state.viewProfile)||activeProfile();
const current=()=>nodes.find(n=>n.id===state.selections['代理选择'])||nodes[0];
function header(title,desc,actions=''){return `<header class="k-header"><div><h1>${title}</h1><p class="k-sub">${desc}</p></div>${actions?`<div class="k-actions">${actions}</div>`:''}</header>`;}
function select(id,values,currentValue,label){return `<select id="${id}" class="k-input" aria-label="${label}">${values.map(v=>`<option ${v===currentValue?'selected':''}>${esc(v)}</option>`).join('')}</select>`;}
function empty(title='从添加一份订阅开始',text='导入订阅后，即可选择节点并启用代理。',action=btn('add-profile',icon('plus')+'添加订阅',true)){return `<div class="k-empty">${icon('layers')}<h2>${title}</h2><p class="k-sub">${text}</p>${action}</div>`;}
function normalizeSelection(){const p=activeProfile();if(!p){state.enabled=false;state.active='';return;}if(!p.ids.includes(state.selections['代理选择']))state.selections['代理选择']=p.ids[0];if(!p.ids.includes(state.selections['流媒体']))state.selections['流媒体']=p.ids[0];}
function addLog(level,text){if(!state.logsPaused)state.logs.unshift({time:'刚刚',level,text});state.logs=state.logs.slice(0,30);}
function notify(message){state.message=message;render();save();}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'Koala UI v2',layout:design.layout,scenario:design.scenario,page:state.page,proxyMode:state.mode,outboundMode:state.outbound,selectedNode:current().name},privateContent:{version:2,design:{...design},page:state.page,mode:state.mode,outbound:state.outbound}}).catch(()=>{});}
function setScenario(){revision++;state.profiles=design.scenario==='首次使用'?[]:freshProfiles();state.active=state.profiles[0]?.id||'';state.viewProfile=state.active;state.enabled=false;state.busy=false;state.coreBusy=false;state.coreReady=true;state.testing=[];state.updating=[];state.error='';state.message='';state.query='';state.page='home';state.selections={'代理选择':'hk1','流媒体':'jp1'};if(design.scenario==='订阅到期'&&activeProfile())activeProfile().days=-1;root.dataset.scenario=design.scenario;}
function restore(saved){const p=saved?.privateContent;if(p?.version!==2)return;for(const key of ['layout','density','appearance','scenario']){const options={layout:['分栏面板','居中连接'],density:['舒适','紧凑'],appearance:['跟随系统','浅色','深色'],scenario:['日常使用','首次使用','连接失败','订阅到期','订阅更新失败']}[key];if(options.includes(p.design?.[key]))design[key]=p.design[key];}if(root.dataset.scenario!==design.scenario)setScenario();if(pages.includes(p.page))state.page=p.page;if(modes.includes(p.mode))state.mode=p.mode;if(['规则','全局','直连'].includes(p.outbound))state.outbound=p.outbound;}
function openDialog(title,body,submitLabel,onSubmit){dialogTrigger=document.activeElement;dialogAction=onSubmit;dialog.innerHTML=`<form id="k-dialog-form"><h2 id="k-dialog-title">${title}</h2>${body}<div class="k-actions">${btn('close-dialog',submitLabel?'取消':'关闭')}${submitLabel?`<button type="submit" class="k-button primary cursor-interaction">${submitLabel}</button>`:''}</div></form>`;decorate();dialog.showModal();}
function closeDialog(){dialog.close();dialogAction=null;if(dialogTrigger?.isConnected)dialogTrigger.focus();else root.querySelector(`[data-page="${state.page}"]`)?.focus();}
function confirmAction(title,text,label,callback){openDialog(title,`<p class="k-dialog-text">${text}</p>`,label,()=>{closeDialog();callback();});}
function modeTabs(){return `<div class="k-mode-tabs" role="tablist" aria-label="代理模式">${modes.map((m,i)=>`<button id="k-mode-${i}" role="tab" aria-controls="k-power-body" aria-selected="${state.mode===m}" data-mode="${m}" ${state.busy?'disabled':''}>${m}</button>`).join('')}</div>`;}
function home(){const p=activeProfile(),n=current();const status=state.busy?state.busyLabel:state.enabled?'代理已启用':'代理未启用';return header('概览','你的连接，一目了然。')+(!p?empty():`${p.days<0?`<div class="k-error">「${esc(p.name)}」已到期。${btn('profiles','切换订阅')}</div>`:''}<div class="k-overview"><section class="k-panel k-power-panel">${modeTabs()}<div class="k-power-body" id="k-power-body" role="tabpanel" aria-labelledby="k-mode-${modes.indexOf(state.mode)}"><div class="k-status"><span class="k-dot ${state.enabled?'on':''}"></span>${state.mode}</div><button class="k-power" data-action="power" data-on="${state.enabled}" aria-label="${state.enabled?'停用代理':'启用代理'}" ${state.busy?'disabled':''}>${icon(state.busy?'loader-circle':'power')}</button><h2>${status}</h2><p class="k-mode-hint">${state.mode==='默认模式'?'使用系统代理，适用于遵循系统代理设置的应用。':'使用虚拟网卡接管流量，适用于更多应用。'}</p><small>${state.enabled?'实际连通性尚未检测':'点击开关启用代理'}</small></div></section><div class="k-side-stack"><section class="k-panel"><small>当前节点 · 代理选择</small><div class="k-node-name">${esc(n.name)}</div><p class="k-sub">${n.type} · ${n.delay===null?'测速超时':n.delay+' ms'}</p><div class="k-node-foot"><span class="k-badge">手动选择</span>${btn('choose','切换节点 '+icon('arrow-right'))}</div></section><section class="k-panel"><h3>出站模式</h3><div class="k-mode" role="group" aria-label="出站模式">${['规则','全局','直连'].map(m=>`<button data-outbound="${m}" aria-pressed="${state.outbound===m}">${m}</button>`).join('')}</div><p class="k-sub">${state.outbound==='规则'?'按照订阅规则分流流量':state.outbound==='全局'?'所有流量使用所选代理':'所有流量直接连接'}</p></section></div></div><section class="k-panel k-subscription"><div class="k-row"><div><small>当前订阅</small><h3>${esc(p.name)}</h3></div>${btn('profiles','管理订阅 '+icon('arrow-up-right'))}</div><div class="k-meter" aria-label="已用流量 ${Math.round(p.used/p.total*100)}%"><span style="width:${p.used/p.total*100}%"></span></div><div class="k-row"><span>剩余 ${p.total-p.used} GB <small>/ ${p.total} GB</small></span><small>${p.days<0?'已到期':'剩余 '+p.days+' 天'}</small></div></section>`);}
function groupNodes(){const p=viewedProfile();let list=nodes.filter(n=>p?.ids.includes(n.id));if(state.group==='流媒体')list=list.filter(n=>['jp1','sg1','us1'].includes(n.id));return list;}
function groupSelection(){if(state.group==='自动选择')return [...groupNodes()].filter(n=>n.delay!==null).sort((a,b)=>a.delay-b.delay)[0]?.id;return state.selections[state.group];}
function nodeRows(){let list=groupNodes().filter(n=>(n.name+' '+n.region+' '+n.type).toLowerCase().includes(state.query.toLowerCase()));if(state.sort==='延迟升序')list.sort((a,b)=>(a.delay??99999)-(b.delay??99999));if(state.sort==='名称排序')list.sort((a,b)=>a.name.localeCompare(b.name));return list.length?list.map(n=>`<div class="k-node-wrap"><button class="k-node" data-node="${n.id}" aria-pressed="${n.id===groupSelection()}" ${state.group==='自动选择'?'disabled':''}><span class="k-region">${n.region}</span><span class="k-node-info"><strong>${esc(n.name)}</strong><small>${n.type}</small></span><span class="k-latency">${state.testing.includes(n.id)?'测速中…':n.delay===null?'超时':n.delay+' ms'}${n.id===groupSelection()?'<br><span class="k-picked">✓ 当前选择</span>':''}</span></button>${btn('test-node','测速',false,`data-id="${n.id}" class-extra="mini" ${state.testing.includes(n.id)?'disabled':''}`)}</div>`).join(''):empty('没有匹配的节点','换个关键词，或清空搜索。',btn('clear-search','清空搜索'));}
function nodesPage(){const p=viewedProfile();return header('代理节点',p?`${esc(p.name)} · ${p.ids.length} 个节点`:'管理策略组与节点选择',btn('home',icon('arrow-left')+'返回概览'))+(!p?empty():`<div class="k-groupbar" role="group" aria-label="策略组">${['代理选择','自动选择','流媒体'].map(g=>`<button data-group="${g}" aria-pressed="${state.group===g}">${g}</button>`).join('')}</div>${p.id!==state.active?`<div class="k-inline-info">正在预览备用订阅，启用后可切换节点。${btn('activate-profile','使用此订阅',false,`data-id="${p.id}"`)}</div>`:''}<div class="k-toolbar"><input class="k-input k-search" id="k-query" type="search" aria-label="搜索节点" placeholder="搜索地区、名称或协议" value="${esc(state.query)}">${select('k-sort',['原始顺序','延迟升序','名称排序'],state.sort,'节点排序')}${btn('test-all',icon('gauge')+'全部测速',false,state.testing.length?'disabled':'')}</div><div class="k-inline-info"><span>${state.group==='自动选择'?'自动选择延迟最低的可用节点':'点击节点即可切换，选择结果自动保存'}</span><span>${groupNodes().length} 个节点</span></div><div class="k-node-list" id="k-results">${nodeRows()}</div>`);}
function profilesPage(){return header('订阅管理',`${state.profiles.length} 份订阅 · 管理节点来源与有效期`,state.profiles.length?btn('add-profile',icon('plus')+'添加订阅',true):'')+(state.profiles.length?state.profiles.map(p=>`<section class="k-panel k-profile ${p.id===state.active?'active':''}"><div class="k-row"><div class="k-profile-title">${icon('layers')}<h3>${esc(p.name)}</h3><span class="k-badge">${p.id===state.active?'正在使用':'备用'}</span></div><span class="k-status ${p.days<0?'k-danger':''}">${p.days<0?'已到期':'剩余 '+p.days+' 天'}</span></div><div class="k-meter"><span style="width:${p.used/p.total*100}%"></span></div><div class="k-row"><span>已用 ${p.used} GB <small>/ ${p.total} GB</small></span><small>${p.ids.length} 个节点</small></div><div class="k-details"><span>更新于 ${esc(p.updated)}</span><span>${p.auto?'自动更新 · 每 24 小时':'手动更新'}</span></div><div class="k-actions" style="margin-top:20px">${p.id!==state.active?btn('activate-profile','使用订阅',true,`data-id="${p.id}"`):''}${btn('update-profile',icon('refresh-cw')+(state.updating.includes(p.id)?'更新中…':'更新'),false,`data-id="${p.id}" ${state.updating.includes(p.id)?'disabled':''}`)}${btn('profile-nodes','节点',false,`data-id="${p.id}"`)}${btn('edit-profile','编辑',false,`data-id="${p.id}"`)}${btn('delete-profile','删除',false,`data-id="${p.id}"`)}</div></section>`).join(''):empty());}
function connectionRows(){const list=state.connections.filter(c=>c.active===(state.connectionTab==='活动连接')&&(c.host+' '+c.process+' '+c.chain).toLowerCase().includes(state.query.toLowerCase()));return list.length?list.map(c=>`<article class="k-list-item"><div class="k-item-body"><h3>${esc(c.host)}</h3><div class="k-item-meta"><span>${c.process} · ${c.protocol}</span><span>${esc(c.chain)}</span></div><div class="k-item-meta"><span>↑ ${c.up}</span><span>↓ ${c.down}</span></div></div><div class="k-item-side">${btn('connection-detail','详情',false,`data-id="${c.id}"`)}${c.active?btn('close-connection','断开',false,`data-id="${c.id}"`):'<small>已关闭</small>'}</div></article>`).join(''):empty('暂无连接记录',state.query?'没有符合搜索条件的连接。':'此分类下没有连接。',state.query?btn('clear-search','清空搜索'):'');}
function connectionsPage(){return header('连接','查看应用流量、命中规则与出站路径',btn('pause-connections',icon(state.paused?'play':'pause')+(state.paused?'恢复刷新':'暂停刷新'))+btn('close-all-connections','断开全部',false,!state.connections.some(c=>c.active)?'disabled':''))+`<div class="k-groupbar" role="group" aria-label="连接分类">${['活动连接','已关闭'].map(t=>`<button data-connection-tab="${t}" aria-pressed="${state.connectionTab===t}">${t} · ${state.connections.filter(c=>c.active===(t==='活动连接')).length}</button>`).join('')}</div><div class="k-toolbar"><input class="k-input" id="k-query" type="search" aria-label="搜索连接" placeholder="搜索域名、应用或出站路径" value="${esc(state.query)}"></div><div class="k-inline-info"><span>${state.paused?'已暂停刷新，保留当前快照':'当前展示连接样例'}</span><span>流量按连接累计</span></div><div class="k-list" id="k-results">${connectionRows()}</div>`;}
function ruleRows(){const list=state.rules.filter(r=>(state.ruleFilter==='全部规则'||r.custom)&&(r.value+' '+r.type+' '+r.target).toLowerCase().includes(state.query.toLowerCase()));return list.length?list.map(r=>`<article class="k-list-item"><div class="k-item-body"><span class="k-rule-type">${r.type}${r.custom?' · 自定义':' · 订阅规则'}</span><h3>${esc(r.value)}</h3></div><div class="k-item-side"><span class="k-rule-target">${esc(r.target)}</span>${r.custom?btn('edit-rule','编辑',false,`data-id="${r.id}"`)+btn('delete-rule','删除',false,`data-id="${r.id}"`):''}</div></article>`).join(''):empty('没有匹配的规则','可添加一条自定义规则，优先于订阅规则匹配。',btn('add-rule','添加规则',true));}
function rulesPage(){return header('规则','按顺序匹配，自定义规则优先于订阅规则',btn('add-rule',icon('plus')+'添加规则',true))+`<div class="k-toolbar"><input class="k-input k-search" id="k-query" type="search" aria-label="搜索规则" placeholder="搜索规则、域名或策略" value="${esc(state.query)}">${select('k-rule-filter',['全部规则','自定义规则'],state.ruleFilter,'规则来源')}</div>${state.outbound!=='规则'?`<div class="k-inline-info">当前出站模式为「${state.outbound}」，规则暂不参与分流。${btn('use-rule-mode','启用规则模式')}</div>`:''}<div class="k-list" id="k-results">${ruleRows()}</div><p class="k-help">订阅规则随订阅更新；自定义规则独立保存，可随时编辑或删除。</p>`;}
function logRows(){const list=state.logs.filter(l=>(state.logLevel==='全部级别'||l.level===state.logLevel)&&l.text.toLowerCase().includes(state.query.toLowerCase()));return list.length?list.map(l=>`<div class="k-log"><span class="k-muted">${l.time}</span><span class="k-log-level ${l.level}">${l.level.toUpperCase()}</span><span class="k-log-content">${esc(l.text)}</span></div>`).join(''):empty('暂无日志',state.query?'没有符合条件的日志。':'执行连接、测速或订阅更新后可查看新日志。',state.query?btn('clear-search','清空搜索'):'');}
function logsPage(){return header('日志','查看运行事件与错误信息',btn('pause-logs',icon(state.logsPaused?'play':'pause')+(state.logsPaused?'继续记录':'暂停记录'))+btn('clear-logs',icon('trash-2')+'清空'))+`<div class="k-toolbar"><input class="k-input k-search" id="k-query" type="search" aria-label="搜索日志" placeholder="搜索日志内容" value="${esc(state.query)}">${select('k-log-level',['全部级别','info','warn','error'],state.logLevel,'日志级别')}</div><div class="k-inline-info"><span>${state.logsPaused?'记录已暂停':'正在记录本次原型操作'}</span><span>${state.logs.length} 条</span></div><div class="k-list" id="k-results">${logRows()}</div>`;}
function settingRow(title,desc,control){return `<div class="k-setting"><div><h3>${title}</h3>${desc?`<p>${desc}</p>`:''}</div>${control}</div>`;}
function toggle(key,label){return `<input type="checkbox" data-setting="${key}" aria-label="${label}" ${state[key]?'checked':''}>`;}
function corePage(){return header('内核','查看运行状态与基础网络配置')+`<section class="k-panel"><div class="k-core-status"><span class="k-core-icon">${icon('cpu')}</span><div><h2>Mihomo</h2><div class="k-status"><span class="k-dot ${state.coreReady?'on':''}"></span>${state.coreBusy?'正在重启…':state.coreReady?'内核运行中':'内核未运行'} · ${state.channel}</div></div></div><div class="k-actions">${btn('restart-core',icon('rotate-cw')+(state.coreBusy?'重启中…':'重启内核'),true,state.coreBusy||state.busy?'disabled':'')}${btn('logs','查看日志 '+icon('arrow-right'))}</div></section><div class="k-setting-group" style="margin-top:24px"><h3>内核配置</h3><div class="k-list">${settingRow('更新通道','稳定版用于日常使用；预览版用于体验新功能。',select('k-channel',['稳定版','预览版'],state.channel,'内核更新通道'))}${settingRow('混合端口','HTTP 与 SOCKS 代理共用此端口。',`<input class="k-input" type="number" id="k-port" aria-label="混合端口" min="1" max="65535" value="${state.mixedPort}">`)}${settingRow('允许局域网连接','允许同一局域网设备访问代理端口。',toggle('allowLan','允许局域网连接'))}</div></div><p class="k-help">配置仅在原型内生效。实际客户端的权限授权和内核下载流程尚未接入。</p>`;}
function settingsPage(){return header('设置','管理外观与启动偏好')+`<section class="k-setting-group"><h3>外观</h3><div class="k-list">${settingRow('主题','选择浅色、深色，或跟随系统。',select('k-appearance',['跟随系统','浅色','深色'],design.appearance,'主题'))}${settingRow('信息密度','调整列表与内容区的间距。',select('k-density',['舒适','紧凑'],design.density,'信息密度'))}${settingRow('首页布局','比较分栏状态面板和居中连接布局。',select('k-layout',['分栏面板','居中连接'],design.layout,'首页布局'))}</div></section><section class="k-setting-group"><h3>启动与窗口</h3><div class="k-list">${settingRow('开机启动','登录电脑后自动启动 Koala Clash。',toggle('autorun','开机启动'))}${settingRow('关闭窗口时最小化','保留客户端在托盘中运行。',toggle('minimize','关闭窗口时最小化'))}</div></section><section class="k-setting-group"><h3>代理</h3><div class="k-list">${settingRow('代理模式',state.mode,btn('home','在概览中切换'))}${settingRow('出站模式',state.outbound,btn('home','在概览中切换'))}</div></section>`;}
const renderers={home,nodes:nodesPage,profiles:profilesPage,connections:connectionsPage,rules:rulesPage,logs:logsPage,core:corePage,settings:settingsPage};
function decorate(){root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));root.querySelectorAll('[class-extra="mini"]').forEach(b=>b.classList.add('k-mini'));if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}

function go(page){state.page=page;state.query='';state.message='';render();save();}
function refreshResults(){const target=root.querySelector('#k-results');if(target){target.innerHTML=({nodes:nodeRows,connections:connectionRows,rules:ruleRows,logs:logRows})[state.page]();decorate();}}
function startModeChange(mode){if(mode===state.mode||state.busy)return;const apply=()=>{if(!state.enabled){state.mode=mode;notify('已切换至'+mode);root.querySelector(`[data-mode="${mode}"]`)?.focus();return;}const previous=state.mode,token=revision;state.busy=true;state.busyLabel='正在切换模式…';render();setTimeout(()=>{if(token!==revision)return;state.busy=false;if(design.scenario==='连接失败'){state.error='模式切换失败，已保留'+previous+'。';}else{state.mode=mode;state.message='已切换至'+mode+'，代理保持启用。';addLog('info','代理模式切换为'+mode);}render();save();},800);};if(state.enabled)confirmAction('切换代理模式',`从${state.mode}切换到${mode}会短暂中断连接，完成后自动恢复代理。`,'切换并恢复',apply);else apply();}
function profileForm(id){const p=state.profiles.find(p=>p.id===id);openDialog(p?'编辑订阅':'添加订阅',`<label for="k-profile-name">订阅名称<input class="k-input" id="k-profile-name" required maxlength="40" value="${esc(p?.name||'')}" placeholder="例如：日常订阅" autocomplete="off"></label><label for="k-profile-url">${p?'更新订阅地址（可选）':'订阅地址'}<input class="k-input" id="k-profile-url" type="url" ${p?'':'required'} placeholder="https://example.com/subscribe" autocomplete="off"></label><label class="k-check"><input type="checkbox" id="k-profile-auto" ${p?.auto!==false?'checked':''}>每 24 小时自动更新</label><p class="k-dialog-text">原型仅演示流程，不请求或保存订阅地址。</p>`,p?'保存更改':'导入订阅',()=>{const name=root.querySelector('#k-profile-name').value.trim();if(!name){root.querySelector('#k-profile-name').setCustomValidity('请输入订阅名称');root.querySelector('#k-profile-name').reportValidity();return;}const auto=root.querySelector('#k-profile-auto').checked;if(p){p.name=name;p.auto=auto;}else{const added={id:'p'+(++idCounter),name,used:0,total:200,days:30,auto,ids:nodes.map(n=>n.id),updated:'刚刚'};state.profiles.push(added);if(!state.active){state.active=added.id;state.viewProfile=added.id;normalizeSelection();}}closeDialog();addLog('info',p?'已保存订阅设置':'已导入新订阅，6 个示例节点');state.page='profiles';notify(p?'订阅设置已保存。':'订阅已导入。可选择「使用订阅」开始使用。');});}
function activateProfile(id){const p=state.profiles.find(p=>p.id===id);if(!p||id===state.active)return;const apply=()=>{state.active=id;state.viewProfile=id;state.error='';normalizeSelection();addLog('info','已切换当前订阅');notify('正在使用「'+p.name+'」。');};if(state.enabled)confirmAction('切换当前订阅','切换订阅会重新加载节点与规则，当前连接可能短暂中断。','切换订阅',apply);else apply();}
function updateProfile(id){const p=state.profiles.find(p=>p.id===id);if(!p||state.updating.includes(id))return;const token=revision;state.updating.push(id);state.error='';render();setTimeout(()=>{if(token!==revision)return;state.updating=state.updating.filter(i=>i!==id);if(!state.profiles.some(x=>x.id===id))return;if(design.scenario==='订阅更新失败'){state.error='「'+p.name+'」更新失败：请求超时。已保留原有节点与配置，请稍后重试。';addLog('error','订阅更新超时，保留现有配置');}else{p.updated='刚刚';state.message='「'+p.name+'」更新完成，共 '+p.ids.length+' 个节点。';addLog('info','订阅更新完成');}render();},850);}
function testNodes(ids){const pending=ids.filter(id=>!state.testing.includes(id));if(!pending.length)return;const token=revision;state.testing.push(...pending);render();setTimeout(()=>{if(token!==revision)return;state.testing=state.testing.filter(id=>!pending.includes(id));const failed=pending.filter(id=>nodes.find(n=>n.id===id)?.delay===null).length;addLog(failed?'warn':'info',`节点测速完成，${pending.length-failed} 个可达，${failed} 个超时`);notify(`测速完成：${pending.length-failed} 个可达，${failed} 个超时。`);},750);}
function ruleForm(id){const r=state.rules.find(r=>r.id===id);openDialog(r?'编辑自定义规则':'添加自定义规则',`<label for="k-rule-type">规则类型${select('k-rule-type',['DOMAIN-SUFFIX','DOMAIN','IP-CIDR'],r?.type||'DOMAIN-SUFFIX','规则类型')}</label><label for="k-rule-value">匹配内容<input class="k-input" id="k-rule-value" required value="${esc(r?.value||'')}" placeholder="例如：example.org"></label><label for="k-rule-target">出站策略${select('k-rule-target',['代理选择','流媒体','DIRECT','REJECT'],r?.target||'代理选择','出站策略')}</label><p class="k-dialog-text">新规则会放在列表顶部，优先匹配。</p>`,'保存规则',()=>{const value=root.querySelector('#k-rule-value').value.trim();const field=root.querySelector('#k-rule-value');if(!value||/\s/.test(value)){field.setCustomValidity('请输入不含空格的域名或网段');field.reportValidity();return;}const type=root.querySelector('#k-rule-type').value,target=root.querySelector('#k-rule-target').value;if(r)Object.assign(r,{type,value,target});else state.rules.unshift({id:'r'+(++idCounter),type,value,target,custom:true});closeDialog();state.query='';addLog('info','自定义规则已保存');notify('规则已保存，当前共 '+state.rules.length+' 条规则。');});}
function connectionDetail(id){const c=state.connections.find(c=>c.id===id);if(!c)return;openDialog('连接详情',`<dl class="k-detail-grid">${[['目标',c.host],['应用',c.process],['协议',c.protocol],['状态',c.active?'活动连接':'已关闭'],['命中规则',c.rule],['出站路径',c.chain],['上传 / 下载',c.up+' / '+c.down]].map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`,'',null);}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.page){go(b.dataset.page);return;}
 if(b.dataset.mode){startModeChange(b.dataset.mode);return;}
 if(b.dataset.outbound){state.outbound=b.dataset.outbound;addLog('info','出站模式切换为'+state.outbound);notify('出站模式已切换为「'+state.outbound+'」。');return;}
 if(b.dataset.group){state.group=b.dataset.group;state.query='';render();save();return;}
 if(b.dataset.connectionTab){state.connectionTab=b.dataset.connectionTab;state.query='';render();return;}
 if(b.dataset.node){if(viewedProfile()?.id!==state.active){notify('请先使用此订阅，再选择节点。');return;}state.selections[state.group]=b.dataset.node;addLog('info',state.group+' → '+nodes.find(n=>n.id===b.dataset.node).name);notify('已切换「'+state.group+'」的节点。');return;}
 const a=b.dataset.action,id=b.dataset.id;
 if(pages.includes(a)){go(a);return;}
 if(a==='close-dialog'){closeDialog();return;}
 if(a==='dismiss-error'){state.error='';render();return;}
 if(a==='choose'){state.viewProfile=state.active;state.group='代理选择';go('nodes');return;}
 if(a==='profile-nodes'){state.viewProfile=id;state.group='代理选择';go('nodes');return;}
 if(a==='add-profile'){profileForm();return;}
 if(a==='edit-profile'){profileForm(id);return;}
 if(a==='activate-profile'){if(state.busy){notify('请等待当前连接操作完成。');return;}activateProfile(id);return;}
 if(a==='delete-profile'){if(state.busy){notify('请等待当前连接操作完成。');return;}const p=state.profiles.find(p=>p.id===id);if(!p)return;confirmAction('删除订阅「'+esc(p.name)+'」',id===state.active?'这是当前订阅。删除后将停用代理，并选择下一份可用订阅。':'删除后将移除此订阅及其节点。','删除订阅',()=>{state.profiles=state.profiles.filter(p=>p.id!==id);if(state.active===id){state.enabled=false;state.active=state.profiles[0]?.id||'';state.viewProfile=state.active;}normalizeSelection();addLog('info','已删除一份订阅');notify('订阅已删除。');});return;}
 if(a==='update-profile'){updateProfile(id);return;}
 if(a==='test-all'){testNodes(groupNodes().map(n=>n.id));return;}
 if(a==='test-node'){testNodes([id]);return;}
 if(a==='clear-search'){state.query='';render();root.querySelector('#k-query')?.focus();return;}
 if(a==='power'){if(state.busy||!activeProfile())return;const token=revision;state.error='';state.message='';state.busy=true;state.busyLabel=state.enabled?'正在停用…':'正在启用…';render();setTimeout(()=>{if(token!==revision)return;state.busy=false;if(!state.enabled&&(design.scenario==='连接失败'||!state.coreReady)){state.error='代理启用失败：无法连接内核。可前往「内核」页重启后重试。';addLog('error','代理启用失败：无法连接内核');}else{state.enabled=!state.enabled;state.message=state.enabled?'代理已启用。':'代理已停用。';addLog('info',state.message+' 当前为'+state.mode);}render();save();},800);return;}
 if(a==='pause-connections'){state.paused=!state.paused;notify(state.paused?'已暂停连接列表刷新。':'已恢复连接列表刷新。');return;}
 if(a==='connection-detail'){connectionDetail(id);return;}
 if(a==='close-connection'){const c=state.connections.find(c=>c.id===id);if(c){c.active=false;addLog('info','已断开 '+c.host);notify('连接已断开，可在「已关闭」中查看。');}return;}
 if(a==='close-all-connections'){confirmAction('断开全部活动连接','应用可能会自动重新建立连接。此操作不关闭代理。','断开全部',()=>{state.connections.forEach(c=>c.active=false);addLog('info','已断开全部活动连接');notify('全部活动连接已断开。');});return;}
 if(a==='add-rule'){ruleForm();return;}
 if(a==='edit-rule'){ruleForm(id);return;}
 if(a==='delete-rule'){const r=state.rules.find(r=>r.id===id);if(!r?.custom)return;confirmAction('删除自定义规则',`删除「${esc(r.value)}」后，该请求将由后续规则决定出站策略。`,'删除规则',()=>{state.rules=state.rules.filter(r=>r.id!==id);addLog('info','已删除一条自定义规则');notify('规则已删除。');});return;}
 if(a==='use-rule-mode'){state.outbound='规则';addLog('info','出站模式切换为规则');notify('出站模式已切换为「规则」。');return;}
 if(a==='pause-logs'){state.logsPaused=!state.logsPaused;notify(state.logsPaused?'日志记录已暂停。':'日志记录已恢复。');return;}
 if(a==='clear-logs'){confirmAction('清空本次日志','将清空当前原型中的日志记录。','清空日志',()=>{state.logs=[];notify('本次日志已清空。');});return;}
 if(a==='restart-core'){const run=()=>{const token=revision,wasEnabled=state.enabled;state.coreBusy=true;state.coreReady=false;state.enabled=false;state.busy=true;state.busyLabel='正在重启内核…';render();setTimeout(()=>{if(token!==revision)return;state.coreBusy=false;state.coreReady=true;state.busy=false;state.enabled=wasEnabled;state.error='';if(design.scenario==='连接失败'){design.scenario='日常使用';root.dataset.scenario=design.scenario;}addLog('info','内核重启完成');notify(wasEnabled?'内核已重启，代理已恢复。':'内核已重启，可返回概览启用代理。');},900);};if(state.enabled)confirmAction('重启内核','重启会短暂中断连接，完成后恢复代理状态。','重启并恢复',run);else run();return;}
});
root.addEventListener('input',e=>{if(e.target.setCustomValidity)e.target.setCustomValidity('');if(e.target.id==='k-query'){state.query=e.target.value;refreshResults();}});
root.addEventListener('change',e=>{
 const target=e.target,key=target.id;
 if(key==='k-sort'){state.sort=target.value;refreshResults();return;}
 if(key==='k-rule-filter'){state.ruleFilter=target.value;refreshResults();return;}
 if(key==='k-log-level'){state.logLevel=target.value;refreshResults();return;}
 if(key==='k-channel'){state.channel=target.value;notify('内核更新通道已设为'+state.channel+'（示例）。');return;}
 if(key==='k-port'){if(!target.checkValidity()){target.reportValidity();return;}state.mixedPort=Number(target.value);notify('混合端口已设为 '+state.mixedPort+'（示例）。');return;}
 if(target.dataset.setting){state[target.dataset.setting]=target.checked;notify('偏好已更新，仅在原型内生效。');return;}
 const designKey={'k-appearance':'appearance','k-density':'density','k-layout':'layout'}[key];if(designKey){design[designKey]=target.value;notify('显示偏好已更新。');}
});
root.addEventListener('keydown',e=>{const button=e.target.closest('[data-mode]');if(!button||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const index=modes.indexOf(button.dataset.mode);const next=e.key==='Home'?0:e.key==='End'?1:(index+1)%2;startModeChange(modes[next]);root.querySelector(`[data-mode="${modes[next]}"]`)?.focus();});
dialog.addEventListener('submit',e=>{e.preventDefault();if(dialogAction)dialogAction();});
dialog.addEventListener('cancel',()=>{dialogAction=null;});
root.dataset.scenario=design.scenario;
restore(window.openai?.widgetState);render();
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{if(root.dataset.scenario!==design.scenario){if(dialog.open)closeDialog();setScenario();}render();save();}});t.addSelect(design,'layout',{label:'首页布局',options:['分栏面板','居中连接']});t.addSelect(design,'density',{label:'信息密度',options:['舒适','紧凑']});t.addSelect(design,'appearance',{label:'主题',options:['跟随系统','浅色','深色']});t.addSelect(design,'scenario',{label:'体验场景',options:['日常使用','首次使用','连接失败','订阅到期','订阅更新失败']});}
})();
</script>
