name: Bug report
description: 报告可复现的问题
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 应用与内核版本
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、预期与实际行为
      description: 附系统版本、架构；配置和日志请先去除订阅链接、密钥、节点凭据。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      render: text
